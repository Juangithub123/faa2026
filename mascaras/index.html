<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Máscaras · FAA! 2026</title>
<meta name="theme-color" content="#1F3A12">
<meta name="robots" content="noindex">
<link rel="icon" href="../icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#10130D;color:#F4F7D9;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1F3A12}
.bar a,.bar button{color:#F4F7D9;background:transparent;border:1px solid rgba(244,247,217,.35);border-radius:999px;padding:6px 12px;font:700 13.5px system-ui;text-decoration:none}
.bar h1{flex:1;font:800 16px system-ui;text-align:center}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(16,19,13,.88)}
.ov[hidden]{display:none}
.box{background:#191D15;border:1px solid #2F3529;border-radius:18px;padding:20px 18px;max-width:420px;width:100%;text-align:center;display:grid;gap:12px}
.box h2{font:900 24px/1.1 system-ui}
.box p{font-size:14.5px;color:#A6AD9B}
.go{border:0;border-radius:999px;padding:13px 18px;font:800 16px system-ui;background:#93CC6E;color:#10130D}
.go[disabled]{opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid #2F3529;background:#191D15;color:#ECEEE5;border-radius:999px;padding:8px 14px;font:700 14px system-ui}
.chip[aria-pressed="true"]{border-color:#93CC6E;background:#25331C}
.act{display:flex;align-items:center;justify-content:center;gap:28px;padding:8px 12px 14px}
.shot{width:68px;height:68px;border-radius:50%;border:5px solid #F4F7D9;background:#93CC6E}
.shot:active{transform:scale(.94)}
.small{width:46px;height:46px;border-radius:50%;border:1px solid #2F3529;background:#191D15;color:#ECEEE5;font:700 20px system-ui}
.msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(16,19,13,.85);padding:6px 12px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.msg[hidden]{display:none}
.meter{display:grid;place-items:center;padding:4px 0}
.meter[hidden]{display:none}
.meter svg{width:min(60vw,240px);height:auto;overflow:visible}
.stats{position:absolute;left:8px;top:8px;white-space:nowrap;background:rgba(16,19,13,.75);color:#ECEEE5;padding:4px 8px;border-radius:8px;font:600 11.5px ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;pointer-events:none}
.stats[hidden]{display:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.8;transition:none}
</style>
</head>
<body>
<div class="bar"><a href="../">← Guía</a><h1 id="ttl">Máscaras</h1><span style="width:70px"></span></div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <video id="vid" playsinline muted></video>
  <div class="flash" id="flash"></div>
  <div class="msg" id="msg" hidden></div>
  <div class="stats" id="stats">Video – fps · Trackeo –/s</div>
  <div class="ov" id="ov">
    <div class="box">
      <h2>Máscaras del FAA!</h2>
      <p>Usa la cámara del teléfono. La imagen se procesa acá mismo y no se sube a ningún lado.</p>
      <p id="note">La primera vez baja unos 4 MB; después funciona sin señal.</p>
      <button class="go" id="start" type="button">Activar cámara</button>
      <div class="meter" id="meter" hidden role="progressbar" aria-label="Descarga" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg viewBox="0 0 200 130" aria-hidden="true">
          <defs><clipPath id="lleno"><rect id="nivel" x="-10" y="120" width="220" height="140"/></clipPath></defs>
          <text x="100" y="116" text-anchor="middle" font-size="138" font-weight="900" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#232820" stroke="#2F3529" stroke-width="2">26</text>
          <text x="100" y="116" text-anchor="middle" font-size="138" font-weight="900" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#93CC6E" clip-path="url(#lleno)">26</text>
        </svg>
      </div>
    </div>
  </div>
</div>
<div class="chips" id="chips"></div>
<div class="act">
  <button class="small" id="flip" type="button" aria-label="Cambiar de cámara">⟲</button>
  <button class="shot" id="shot" type="button" aria-label="Sacar foto"></button>
  <span style="width:46px"></span>
</div>
<script type="module" src="mascaras.js?v=9"></script>
</body>
</html>
